name: Build genshinimpact_nx.nro

on:
  push:
    branches: [main, experiment/nvk-26.1.4-loaderless]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Guard against committed game binaries
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BAD=$(git ls-files | grep -iE '\.(so|apk|obb|xapk|pack|dat)$|dump\.cs|global-metadata' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Proprietary game files are tracked in this repository:"
            echo "$BAD"
            exit 1
          fi

      - name: Install public NVK SDK
        run: |
          set -eux
          NVK_URL=https://github.com/rulled/nvk-switch/releases/download/mesa-26.1.4-nxvk-69ec283-r1/nvk-switch-mesa-26.1.4-nxvk-69ec283-r1.tar.xz
          NVK_SHA256=c4682dbbe252cee9d22f98863786d71faa6a3b8a9d7db94e53929b2ab698f43d
          curl -fL "$NVK_URL" -o /tmp/nvk-switch.tar.xz
          echo "$NVK_SHA256  /tmp/nvk-switch.tar.xz" | sha256sum -c -
          mkdir -p /opt/nvk-switch
          tar -xJf /tmp/nvk-switch.tar.xz -C /opt/nvk-switch --strip-components=1
          test -f /opt/nvk-switch/lib/libvulkan.a
          test -f /opt/nvk-switch/include/vulkan/vulkan_vi.h
          test -f /opt/nvk-switch/include/vk_video/vulkan_video_codecs_common.h
          grep -q '^mesa_version=26.1.4$' /opt/nvk-switch/BUILD-MANIFEST.txt
          grep -q '^vulkan_header_version=354$' /opt/nvk-switch/BUILD-MANIFEST.txt
          grep -q '^nxvk_commit=69ec283dbda64e65347a36274efb349122e85363$' /opt/nvk-switch/BUILD-MANIFEST.txt
          (cd /opt/nvk-switch && sha256sum -c SHA256SUMS)

      - name: Preflight
        run: |
          make preflight \
            NVK_SWITCH_ROOT=/opt/nvk-switch
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITA64: /opt/devkitpro/devkitA64

      - name: Build
        run: |
          make -j"$(nproc)" \
            NVK_SWITCH_ROOT=/opt/nvk-switch
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITA64: /opt/devkitpro/devkitA64

      - name: Check loaderless Vulkan ABI
        run: |
          make check-loaderless-abi \
            NVK_SWITCH_ROOT=/opt/nvk-switch
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITA64: /opt/devkitpro/devkitA64

      - name: Package experimental artifact
        run: |
          set -eux
          OUT="$GITHUB_WORKSPACE/artifact"
          mkdir -p "$OUT/licenses"
          cp genshinimpact_nx.nro genshinimpact_nx.elf "$OUT/"
          cp LICENSE "$OUT/licenses/genshinimpact_nx-LICENSE"
          cp -r /opt/nvk-switch/licenses/. "$OUT/licenses/"
          {
            echo 'artifact=genshinimpact_nx-client-1234-nvk-26.1.4'
            echo "genshin_commit=$GITHUB_SHA"
            cat /opt/nvk-switch/BUILD-MANIFEST.txt
            echo 'sdk_archive_sha256=c4682dbbe252cee9d22f98863786d71faa6a3b8a9d7db94e53929b2ab698f43d'
            echo 'sdk_release=https://github.com/rulled/nvk-switch/releases/tag/mesa-26.1.4-nxvk-69ec283-r1'
          } > "$OUT/BUILD-MANIFEST.txt"
          strings genshinimpact_nx.nro | grep -E 'Mesa 26\.1\.4|26\.1\.4' | sort -u > "$OUT/MESA-VERSION-STRINGS.txt" || true
          (cd "$OUT" && sha256sum genshinimpact_nx.nro genshinimpact_nx.elf > SHA256SUMS)
          BAD=$(find "$OUT" -type f | grep -iE '\.(so|apk|obb|xapk|pack|dat)$|dump\.cs|global-metadata' || true)
          test -z "$BAD"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genshinimpact_nx-client-1234-nvk-26.1.4
          path: artifact/
          if-no-files-found: error
