name: Build genshinimpact_nx.nro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Guard against committed game binaries
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BAD=$(git ls-files | grep -iE '\.(so|apk|obb|xapk|pack|dat)$|dump\.cs|global-metadata' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Proprietary game files are tracked in this repository:"
            echo "$BAD"
            exit 1
          fi

      - name: Install public NVK SDK
        run: |
          set -eux
          NVK_URL=https://github.com/jhuz0/nvk-switch/releases/download/nvk-switch-mesa-25.0.7-r1/nvk-switch-25.0.7.tar.xz
          NVK_SHA256=4ab244f982dc078aaff8c58640d7cf8a0f3ab43bbf2daadfd00c02fbf352af86
          curl -fL "$NVK_URL" -o /tmp/nvk-switch.tar.xz
          echo "$NVK_SHA256  /tmp/nvk-switch.tar.xz" | sha256sum -c -
          mkdir -p /opt/nvk-switch
          tar -xJf /tmp/nvk-switch.tar.xz -C /opt/nvk-switch
          test -f /opt/nvk-switch/lib/libvulkan.a
          test -f /opt/nvk-switch/include/vulkan/vulkan_vi.h

      - name: Install matching Vulkan video headers
        run: |
          set -eux
          git clone --filter=blob:none --no-checkout \
            https://github.com/KhronosGroup/Vulkan-Headers.git \
            /opt/Vulkan-Headers
          git -C /opt/Vulkan-Headers checkout --detach \
            a03d2f6d5753b365d704d58161825890baad0755
          grep -q '#define VK_HEADER_VERSION 305' \
            /opt/Vulkan-Headers/include/vulkan/vulkan_core.h
          test -f /opt/Vulkan-Headers/include/vk_video/vulkan_video_codecs_common.h

      - name: Preflight
        run: |
          make preflight \
            NVK_SWITCH_ROOT=/opt/nvk-switch \
            VULKAN_HEADERS_ROOT=/opt/Vulkan-Headers
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITA64: /opt/devkitpro/devkitA64

      - name: Build
        run: |
          make -j"$(nproc)" \
            NVK_SWITCH_ROOT=/opt/nvk-switch \
            VULKAN_HEADERS_ROOT=/opt/Vulkan-Headers
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITA64: /opt/devkitpro/devkitA64

      - name: Check loaderless Vulkan ABI
        run: |
          make check-loaderless-abi \
            NVK_SWITCH_ROOT=/opt/nvk-switch \
            VULKAN_HEADERS_ROOT=/opt/Vulkan-Headers
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITA64: /opt/devkitpro/devkitA64

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genshinimpact_nx
          path: genshinimpact_nx.nro
          if-no-files-found: error
